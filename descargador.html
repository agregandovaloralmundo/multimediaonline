<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        if (localStorage.getItem("grabando") === "true") {
            alert("⛔ Esta función está deshabilitada temporalmente porque hay una grabación en curso. Detén la grabación o espera a que finalice.");
            window.history.back();
        }
    </script>
    <title>Multimedia Online - Descargar Videos</title>
    <meta name="description" content="Descarga y gestiona tus videos, audios y archivos multimedia de forma rápida y gratuita en Multimedia Online." />
    <meta name="author" content="Lic. Antonio Ramírez Bogantes" />
    <link rel="icon" type="image/x-icon" href="img/principal.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        .main-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
        }
        .mascot-img {
            width: 170px;
            height: 170px;
            object-fit: contain;
            margin-bottom: 6px;
        }
        .downloader-box {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            border: 3px solid #0d6efd;
            border-radius: 20px;
            padding: 26px 28px;
            box-shadow: 0 6px 18px rgba(13, 110, 253, 0.15);
        }
        .thumb-img, .video-preview {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 2px solid #dee2e6;
            max-height: 230px;
            object-fit: cover;
            background: #000;
        }
        .embed-downloader {
            width: 100%;
            height: 260px;
            border: 2px solid #0d6efd;
            border-radius: 12px;
            margin-top: 10px;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div id="navbar-placeholder"></div>
        <script src="navbar.js"></script>

        <div class="main-content">
            <!-- Muñeco despegado encima del marco azul -->
            <img id="mascotImg" src="img/descargar.png" alt="Descargar Videos" class="mascot-img">

            <!-- Marco azul ancho con título y subtítulo adentro -->
            <div class="downloader-box">
                <h3 class="mb-1 fw-bold text-dark">Descargar Videos</h3>
                <p class="text-muted small mb-3">Pega el enlace del video o archivo multimedia libre para analizar y guardar en tu equipo</p>

                <div id="inputBox">
                    <div class="input-group input-group-lg">
                        <input type="text" id="urlInput" class="form-control" placeholder="Pega el link aquí..." autofocus>
                        <button class="btn btn-primary fw-bold px-4" id="btnAnalizar" onclick="analizarVideo()">🔍 Analizar</button>
                    </div>
                </div>

                <div id="previewArea" style="display: none;" class="mt-3">
                    <img id="videoThumb" src="" class="thumb-img" style="display:none;">
                    <video id="videoPlayer" class="video-preview" controls style="display:none;"></video>
                    <audio id="audioPlayer" class="w-100 mb-3" controls style="display:none;"></audio>
                    <div id="videoTitle" class="fw-bold text-dark mb-3"></div>

                    <div id="directActions"></div>

                    <!-- Contenedor incrustado dentro de la misma página (sin salir del sitio) -->
                    <div id="embedContainer" style="display:none;">
                        <iframe id="embedFrame" class="embed-downloader" allowtransparency="true" scrolling="no"></iframe>
                    </div>

                    <button class="btn btn-sm btn-secondary mt-3" onclick="reset()">
                        🔄 Analizar otro enlace
                    </button>
                </div>

                <div id="loader" style="display: none;" class="mt-3">
                    <div class="spinner-border text-primary mb-2"></div>
                    <p class="fw-bold text-primary mb-0">Analizando enlace...</p>
                </div>

                <div id="successBox" style="display:none;" class="mt-3">
                    <div class="alert alert-success fw-bold">✅ ¡Descarga iniciada! Revisa tu carpeta de Descargas</div>
                    <button class="btn btn-primary fw-bold w-100" onclick="reset()">Descargar otro video</button>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
        <script src="footer.js"></script>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const CANDIDATOS_IMAGEN = [
            "img/descargar.png",
            "img/descargar.png.jpg",
            "img/descargar.png.webp",
            "img/descargar.png.jpeg",
            "img/descargar.jpg",
            "img/descargar.webp"
        ];
        let indiceImagen = 0;

        const mascotImg = document.getElementById('mascotImg');
        mascotImg.onerror = () => {
            indiceImagen++;
            if (indiceImagen < CANDIDATOS_IMAGEN.length) {
                mascotImg.src = CANDIDATOS_IMAGEN[indiceImagen];
            }
        };

        function limpiarFondoExterior(imgElement) {
            if (window.location.protocol === "file:") return;
            const tempImg = new Image();
            tempImg.crossOrigin = "anonymous";
            tempImg.src = imgElement.src;
            tempImg.onload = () => {
                try {
                    const w = tempImg.naturalWidth;
                    const h = tempImg.naturalHeight;
                    if (!w || !h) return;

                    const canvas = document.createElement("canvas");
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(tempImg, 0, 0);

                    const imgData = ctx.getImageData(0, 0, w, h);
                    const data = imgData.data;
                    const visited = new Uint8Array(w * h);
                    const stack = [];

                    function esFondoClaro(idx) {
                        const p = idx * 4;
                        const r = data[p], g = data[p + 1], b = data[p + 2], a = data[p + 3];
                        if (a < 20) return true;
                        const diff = Math.max(Math.abs(r - g), Math.abs(g - b), Math.abs(r - b));
                        return r > 195 && g > 195 && b > 195 && diff < 18;
                    }

                    for (let x = 0; x < w; x++) {
                        if (esFondoClaro(x)) { stack.push(x); visited[x] = 1; }
                        const bot = (h - 1) * w + x;
                        if (esFondoClaro(bot)) { stack.push(bot); visited[bot] = 1; }
                    }
                    for (let y = 0; y < h; y++) {
                        const left = y * w;
                        if (esFondoClaro(left)) { stack.push(left); visited[left] = 1; }
                        const right = y * w + (w - 1);
                        if (esFondoClaro(right)) { stack.push(right); visited[right] = 1; }
                    }

                    while (stack.length > 0) {
                        const curr = stack.pop();
                        data[curr * 4 + 3] = 0;
                        const cx = curr % w;
                        const cy = (curr - cx) / w;

                        if (cx > 0 && !visited[curr - 1] && esFondoClaro(curr - 1)) { visited[curr - 1] = 1; stack.push(curr - 1); }
                        if (cx < w - 1 && !visited[curr + 1] && esFondoClaro(curr + 1)) { visited[curr + 1] = 1; stack.push(curr + 1); }
                        if (cy > 0 && !visited[curr - w] && esFondoClaro(curr - w)) { visited[curr - w] = 1; stack.push(curr - w); }
                        if (cy < h - 1 && !visited[curr + w] && esFondoClaro(curr + w)) { visited[curr + w] = 1; stack.push(curr + w); }
                    }

                    ctx.putImageData(imgData, 0, 0);
                    imgElement.src = canvas.toDataURL("image/png");
                } catch (e) {}
            };
        }

        window.onload = () => {
            document.getElementById('urlInput').focus();
            limpiarFondoExterior(mascotImg);
        };

        function mostrarMensaje(titulo, texto, icono) {
            return Swal.fire({
                title: titulo,
                text: texto,
                icon: icono,
                confirmButtonColor: '#0d6efd',
                confirmButtonText: 'Entendido'
            });
        }

        function extraerYoutubeId(url) {
            const match = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            return match ? match[1] : null;
        }

        function esAudioDirecto(url) {
            return /\.(mp3|wav|ogg|m4a)(\?.*)?$/i.test(url);
        }

        function esVideoDirecto(url) {
            return /\.(mp4|webm|mov|ogv)(\?.*)?$/i.test(url);
        }

        async function descargarEnMismaPagina(url, nombreArchivo) {
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error("CORS");
                const blob = await resp.blob();
                const blobUrl = URL.createObjectURL(blob);

                const enlace = document.createElement('a');
                enlace.href = blobUrl;
                enlace.download = nombreArchivo;
                document.body.appendChild(enlace);
                enlace.click();
                enlace.remove();
                URL.revokeObjectURL(blobUrl);
                marcarExito();
            } catch {
                const enlace = document.createElement('a');
                enlace.href = url;
                enlace.setAttribute('download', nombreArchivo);
                document.body.appendChild(enlace);
                enlace.click();
                enlace.remove();
                marcarExito();
            }
        }

        function abrirSelectorInterno(ytId, formato) {
            const embedContainer = document.getElementById('embedContainer');
            const embedFrame = document.getElementById('embedFrame');
            const actionsDiv = document.getElementById('directActions');

            actionsDiv.style.display = 'none';
            embedContainer.style.display = 'block';
            embedFrame.src = `https://loader.to/api/button/?url=https://www.youtube.com/watch?v=${ytId}&f=${formato}&color=0d6efd`;
        }

        async function analizarVideo() {
            const urlInput = document.getElementById('urlInput');
            const rawUrl = urlInput.value.trim();
            const btn = document.getElementById('btnAnalizar');

            if (!rawUrl) {
                urlInput.focus();
                return;
            }
            if (!/^https?:\/\//i.test(rawUrl)) {
                await mostrarMensaje('Enlace inválido', 'Por favor pega un enlace completo que empiece con https://', 'warning');
                urlInput.focus();
                return;
            }

            btn.innerText = "...";
            btn.disabled = true;
            document.getElementById('previewArea').style.display = 'none';
            document.getElementById('embedContainer').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            const actionsDiv = document.getElementById('directActions');
            actionsDiv.style.display = 'block';
            actionsDiv.innerHTML = "";

            try {
                const videoPlayer = document.getElementById('videoPlayer');
                const audioPlayer = document.getElementById('audioPlayer');
                const thumb = document.getElementById('videoThumb');

                // 1. Si es archivo directo (.mp4, .mp3, .webm...)
                if (esVideoDirecto(rawUrl) || esAudioDirecto(rawUrl)) {
                    thumb.style.display = 'none';
                    const nombreArchivo = decodeURIComponent(rawUrl.split('/').pop().split('?')[0]) || "multimedia_avm.mp4";

                    if (esAudioDirecto(rawUrl)) {
                        videoPlayer.style.display = 'none';
                        audioPlayer.style.display = 'block';
                        audioPlayer.src = rawUrl;
                    } else {
                        audioPlayer.style.display = 'none';
                        videoPlayer.style.display = 'block';
                        videoPlayer.src = rawUrl;
                    }

                    document.getElementById('videoTitle').innerText = nombreArchivo;
                    actionsDiv.innerHTML = `
                        <button class="btn btn-success btn-lg w-100 fw-bold mb-2" onclick="descargarEnMismaPagina('${rawUrl.replace(/'/g, "\\'")}', '${nombreArchivo.replace(/'/g, "\\'")}')">
                            ⬇️ Descargar Archivo en tu Equipo
                        </button>
                    `;

                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('previewArea').style.display = 'block';
                    return;
                }

                // 2. Si es enlace de YouTube u otra plataforma web
                const ytId = extraerYoutubeId(rawUrl);
                let tituloDetectado = "Video Detectado";
                let miniatura = "";

                try {
                    const oembed = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(rawUrl)}`);
                    if (oembed.ok) {
                        const info = await oembed.json();
                        if (info.title) tituloDetectado = info.title;
                        if (info.thumbnail_url) miniatura = info.thumbnail_url;
                    }
                } catch {}

                videoPlayer.style.display = 'none';
                audioPlayer.style.display = 'none';

                if (ytId) {
                    miniatura = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                    thumb.src = miniatura;
                    thumb.style.display = 'block';
                    document.getElementById('videoTitle').innerText = tituloDetectado;

                    actionsDiv.innerHTML = `
                        <button class="btn btn-success btn-lg w-100 fw-bold mb-2" onclick="abrirSelectorInterno('${ytId}', '720')">
                            ⬇️ Descargar Video (MP4 HD) aquí mismo
                        </button>
                        <button class="btn btn-outline-primary w-100 fw-bold mb-2" onclick="abrirSelectorInterno('${ytId}', 'mp3')">
                            🎵 Descargar Solo Audio (MP3) aquí mismo
                        </button>
                        <button class="btn btn-outline-dark btn-sm w-100 mb-1" onclick="descargarEnMismaPagina('https://img.youtube.com/vi/${ytId}/maxresdefault.jpg', 'miniatura_${ytId}.jpg')">
                            🖼️ Guardar Miniatura HD (JPG)
                        </button>
                    `;
                } else {
                    if (miniatura) {
                        thumb.src = miniatura;
                        thumb.style.display = 'block';
                    } else {
                        thumb.style.display = 'none';
                    }
                    document.getElementById('videoTitle').innerText = tituloDetectado;
                    actionsDiv.innerHTML = `
                        <button class="btn btn-success btn-lg w-100 fw-bold mb-2" onclick="descargarEnMismaPagina('${rawUrl.replace(/'/g, "\\'")}', 'multimedia_avm.mp4')">
                            ⬇️ Intentar Descarga Directa
                        </button>
                    `;
                }

                document.getElementById('loader').style.display = 'none';
                document.getElementById('previewArea').style.display = 'block';
                urlInput.blur();
            } catch (e) {
                document.getElementById('loader').style.display = 'none';
                await mostrarMensaje('Aviso', 'Verifica que el enlace sea público y esté bien copiado.', 'info');
                reset();
            } finally {
                btn.innerText = "🔍 Analizar";
                btn.disabled = false;
            }
        }

        function marcarExito() {
            setTimeout(() => {
                document.getElementById('previewArea').style.display = 'none';
                document.getElementById('inputBox').style.display = 'none';
                document.getElementById('successBox').style.display = 'block';
            }, 700);
        }

        function reset() {
            const input = document.getElementById('urlInput');
            const videoPlayer = document.getElementById('videoPlayer');
            const audioPlayer = document.getElementById('audioPlayer');
            const embedFrame = document.getElementById('embedFrame');
            videoPlayer.pause();
            videoPlayer.src = "";
            audioPlayer.pause();
            audioPlayer.src = "";
            embedFrame.src = "about:blank";
            input.value = "";
            document.getElementById('inputBox').style.display = 'flex';
            document.getElementById('previewArea').style.display = 'none';
            document.getElementById('embedContainer').style.display = 'none';
            document.getElementById('loader').style.display = 'none';
            document.getElementById('successBox').style.display = 'none';
            input.focus();
        }

        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') analizarVideo();
        });
    </script>
</body>
</html>
